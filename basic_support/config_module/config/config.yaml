# 全局配置
global:
  env: "development"
  log_level: "INFO"
  hot_reload: true
  hot_reload_interval: 5
  backup_enabled: true
  backup_interval: 24
  backup_retention: 7

# 配置校验规则
validate_rules:
  global.env:
    type: "str"
    required: true
    range: ["development", "test", "production"]
  vector_db.vector_dimension:
    type: "int"
    required: true
    range: [128, 2048]
  llm.temperature:
    type: "float"
    required: true
    range: [0.0, 1.0]
  security.auth_enabled:
    type: "bool"
    required: true

vector_db:
  type: "faiss"
  host: "localhost"
  api_key: "${VECTOR_DB_API_KEY}"
  index_name: "rag-agent-index"
  vector_dimension: 384

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_length: 512

llm:
  temperature: 0.7

  common:
    timeout: 15
    max_retry: 1

  default_vector_model: "text-embedding-3-small"
  default_chat_model: "qwen-turbo"
  default_multimodal_model: "qwen-vl-plus"

  openai:
    text-embedding-3-small:
      request_type: "VECTOR"
      adapter_class: "OpenAIVectorAdapter"
      api_key: "${OPENAI_API_KEY}"
      api_base: "https://api.openai.com/v1"

    qwen-turbo:
      request_type: "CHAT"
      adapter_class: "OpenAIChatAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    qwen-vl-plus:
      request_type: "MULTIMODAL"
      adapter_class: "OpenAIMultimodalAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    gpt-4o-mini:
      request_type: "MULTIMODAL"
      adapter_class: "OpenAIMultimodalAdapter"
      api_key: "${OPENAI_API_KEY}"
      api_base: "https://api.openai.com/v1"

agent:
  max_retries: 3
  timeout: 30

document_store:
  dir: "documents"

state_store:
  dir: "state_store"

security:
  auth_enabled: true
  auth_type: "apikey"
  api_keys:
    - "${API_KEY_1}"
  jwt_secret: "${JWT_SECRET}"
  sensitive_config_secret: "${SENSITIVE_CONFIG_SECRET}"
  # 内部白名单 (前缀匹配): 这些 IP 即使没认证也允许 body tenant_id 透传。
  # 默认包含 localhost / 127.0.0.1, 方便本地 Web UI 直接选 tenant.
  # 生产部署面向公网时建议清空或调整为内网网段。
  internal_whitelist:
    - "127.0.0.1"
    - "localhost"
    - "::1"

remote_config:
  enabled: false
  url: "http://nacos-server:8848/nacos/v1/cs/configs"
  data_id: "rag-agent-config"
  group: "DEFAULT_GROUP"
  config_type: "yaml"
