# 全局配置
global:
  env: "development"
  log_level: "INFO"
  hot_reload: true
  hot_reload_interval: 5

# 配置校验规则
validate_rules:
  global.env:
    type: "str"
    required: true
    range: ["development", "test", "production"]
  vector_db.vector_dimension:
    type: "int"
    required: true
    range: [128, 2048]
  llm.temperature:
    type: "float"
    required: true
    range: [0.0, 1.0]
  security.auth_enabled:
    type: "bool"
    required: true

vector_db:
  type: "faiss"
  host: "localhost"
  api_key: "${VECTOR_DB_API_KEY}"
  index_name: "rag-agent-index"
  vector_dimension: 384

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_length: 512

llm:
  temperature: 0.7

  common:
    # LLM 单次请求超时秒. 写长文 / 推理类任务 15s 通常不够.
    # 长上下文 + 长输出 (例: 写 6000 字, qwen-turbo 大约 60-90s) 需要 120s.
    timeout: 120
    max_retry: 1

  default_vector_model: "text-embedding-3-small"
  # 主力 chat 模型: qwen-turbo(轻) / qwen-plus(快但大数推理会崩, 如 12345*67890 答成 5555) / qwen-max(最强最准但慢, 当前)。
  # 实测 qwen-max 在多轮 agent 循环 (react+verify, 每步一次调用) 下耗时 78s+ → 网关 504 超时,
  # 反而干不成活; qwen-plus 约 36s 能完成。要 qwen-max 需先降调用 (见 agent.enable_self_verify) 或加超时。
  default_chat_model: "qwen-max"
  default_multimodal_model: "qwen-vl-plus"

  openai:
    text-embedding-3-small:
      request_type: "VECTOR"
      adapter_class: "OpenAIVectorAdapter"
      api_key: "${OPENAI_API_KEY}"
      api_base: "https://api.openai.com/v1"

    qwen-turbo:
      request_type: "CHAT"
      adapter_class: "OpenAIChatAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    # qwen-plus: 能力/成本甜点 (约 turbo 的 3-4x 价), 当前 default_chat_model.
    qwen-plus:
      request_type: "CHAT"
      adapter_class: "OpenAIChatAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    # qwen-max: 旗舰最强档 (约 turbo 的 60-100x 价). 已注册备用; 想要最强把
    # default_chat_model 改成 qwen-max 即可 (注意成本).
    qwen-max:
      request_type: "CHAT"
      adapter_class: "OpenAIChatAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    qwen-vl-plus:
      request_type: "MULTIMODAL"
      adapter_class: "OpenAIMultimodalAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    gpt-4o-mini:
      request_type: "MULTIMODAL"
      adapter_class: "OpenAIMultimodalAdapter"
      api_key: "${OPENAI_API_KEY}"
      api_base: "https://api.openai.com/v1"

rag:
  enable_hybrid_search: true

agent:
  max_retries: 3
  # 墙钟超时 120s (对齐 factories/business_layer 注释意图): 多轮 ReAct + 附件读取 +
  # qwen 单次延迟, 30s 连"读附件再总结"都跑不完 — 撞超时丢掉全部已收集结果。
  # 用户优先"慢但能完成"。
  timeout: 120
  # 默认走 ReAct 多轮 (observe→think→act 迭代), 比 single_shot 单轮规划更能完成
  # 复杂任务. 单次 invoke 可用 extra_params.execution_strategy / max_iterations 覆盖.
  execution_strategy: "react"
  # 自我验证闭环 (方向3): 默认开 — 每个 agent 任务执行后做终态确认 (TaskVerifier
  # LLMJudge 判"是否真完成了目标"), 未完成则带缺口反馈自纠正 (auto, 预算 1 次重跑).
  # 形成 执行→校验→重规划 闭环。代价: 每任务 +1 次校验 LLM 调用 + 失败时至多 1 次重跑。
  # 无 LLM 通道时 verify 自动放行 (fail-open), 不阻断。想关: enable_self_verify=false 或 verify_mode=off。
  enable_self_verify: true
  verify_mode: "auto"
  max_correction: 1
  # UP-4 (方向1) query refinement: 含糊问题基于画像优化提问。总开关 enable_query_refine
  # 默认 false(关); query_refine_max_len 默认 200(均走代码默认, 此处不赘列)。
  # query_refine_mode: auto=歧义时静默改写问题(原行为) / ask=歧义大时反问澄清(不改写,
  # 早退把一个澄清问题返回给用户)。单次可 extra_params.query_refine_mode 覆盖。
  query_refine_mode: "auto"
  # 自维护定时扫描 (方向1/4): 需先 enable_self_reflection=true 才会注册 (否则跳过+WARN)。
  # 不配 maintenance_schedule = 不注册 = 不起调度线程 (默认行为)。配置后由 TaskScheduler 周期触发
  # run_maintenance_scan (聚合 行为/记忆/代码文档 提议 + 通知; auto_apply 仅安全算子 run_prune/
  # run_degrade, reconcile/consolidate 永不自动)。schedule 支持 "every Xs/m/h" 或 "@daily HH:MM"(UTC)。
  # maintenance_schedule: "@daily 04:00"
  # maintenance_scope: ["memory"]        # 方向1 仅记忆域(reconcile/consolidate/prune); 全域省略=三域全扫
  # maintenance_auto_apply: null         # null=按 auto_approve_maintenance 名单决定

# 任务调度 (方向1/4): 仅当配置了定时任务 (下面 tasks 或 agent.maintenance_schedule) 时
# 才起后台调度线程; 否则不接线 (/scheduler/* 路由返 SERVICE_UNAVAILABLE)。默认空 = 关。
scheduler:
  tasks: []   # 通用定时任务; 每条 {id, schedule, type, body, enabled}; schedule 见上 maintenance_schedule

document_store:
  dir: "documents"

# 服务层文件治理
api_service:
  # 上传原件保留天数: >0 时后台每日清理 — 已索引的非图片原件 + uploads/screenshots/
  # 超期截图。0 = 不清理。图片原件永远保留 (image_describe 会话中按路径回读)。
  upload_retention_days: 30

# per-tenant 资源配额 (不配 = 不限制; 配 0 = 冻结新增)
quotas:
  default:
    max_documents: 1000          # 文档数上限 (按唯一 content_hash 计)
    max_vector_store_mb: 51200   # 向量库字节配额 50GB (N*dim*4B 预估)

state_store:
  dir: "state_store"
  # 会话历史保留: mtime 超过 expire_hours 未更新则在启动/读写时清理 (默认 24h 太短会丢历史)。
  # 2160h = 90 天; 设 0 或负数 = 永不过期。
  expire_hours: 2160

security:
  auth_enabled: true
  auth_type: "apikey"
  api_keys:
    - "${API_KEY_1}"
  jwt_secret: "${JWT_SECRET}"
  sensitive_config_secret: "${SENSITIVE_CONFIG_SECRET}"
  # 内部白名单: 这些来源即使没认证也允许 body tenant_id 透传。
  # 条目支持 IP / CIDR 网段 ("10.0.0.0/8") / 主机名精确匹配 / 旧式 "10.0.0." 点边界前缀。
  # 默认包含 localhost / 127.0.0.1, 方便本地 Web UI 直接选 tenant.
  # 生产部署面向公网时建议清空或调整为内网网段。
  internal_whitelist:
    - "127.0.0.1"
    - "localhost"
    - "::1"
  # admin keys: 配置后 /config/models 等管理写端点仅持这些 key 可调 (403 拦截)。
  # 留空/不配 = 不额外设防 (此时生产应在网关层屏蔽 /config/*)。
  # admin_api_keys:
  #   - "${ADMIN_API_KEY}"

remote_config:
  enabled: false
  url: "http://nacos-server:8848/nacos/v1/cs/configs"
  data_id: "rag-agent-config"
  group: "DEFAULT_GROUP"
  config_type: "yaml"
