# 全局配置
global:
  env: "development"
  log_level: "INFO"
  hot_reload: true
  hot_reload_interval: 5
  backup_enabled: true
  backup_interval: 24
  backup_retention: 7

# 配置校验规则
validate_rules:
  global.env:
    type: "str"
    required: true
    range: ["development", "test", "production"]
  vector_db.vector_dimension:
    type: "int"
    required: true
    range: [128, 2048]
  llm.temperature:
    type: "float"
    required: true
    range: [0.0, 1.0]
  security.auth_enabled:
    type: "bool"
    required: true

vector_db:
  type: "faiss"
  host: "localhost"
  api_key: "${VECTOR_DB_API_KEY}"
  index_name: "rag-agent-index"
  vector_dimension: 384

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_length: 512

llm:
  temperature: 0.7

  common:
    # LLM 单次请求超时秒. 写长文 / 推理类任务 15s 通常不够.
    # 长上下文 + 长输出 (例: 写 6000 字, qwen-turbo 大约 60-90s) 需要 120s.
    timeout: 120
    max_retry: 1

  default_vector_model: "text-embedding-3-small"
  # 主力 chat 模型: qwen-turbo(最轻量) → qwen-plus(能力/成本甜点). 想最强改 qwen-max.
  default_chat_model: "qwen-plus"
  default_multimodal_model: "qwen-vl-plus"

  openai:
    text-embedding-3-small:
      request_type: "VECTOR"
      adapter_class: "OpenAIVectorAdapter"
      api_key: "${OPENAI_API_KEY}"
      api_base: "https://api.openai.com/v1"

    qwen-turbo:
      request_type: "CHAT"
      adapter_class: "OpenAIChatAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    # qwen-plus: 能力/成本甜点 (约 turbo 的 3-4x 价), 当前 default_chat_model.
    qwen-plus:
      request_type: "CHAT"
      adapter_class: "OpenAIChatAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    # qwen-max: 旗舰最强档 (约 turbo 的 60-100x 价). 已注册备用; 想要最强把
    # default_chat_model 改成 qwen-max 即可 (注意成本).
    qwen-max:
      request_type: "CHAT"
      adapter_class: "OpenAIChatAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    qwen-vl-plus:
      request_type: "MULTIMODAL"
      adapter_class: "OpenAIMultimodalAdapter"
      api_key: "${DASHSCOPE_API_KEY}"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    gpt-4o-mini:
      request_type: "MULTIMODAL"
      adapter_class: "OpenAIMultimodalAdapter"
      api_key: "${OPENAI_API_KEY}"
      api_base: "https://api.openai.com/v1"

rag:
  enable_hybrid_search: true

agent:
  max_retries: 3
  timeout: 30
  # 默认走 ReAct 多轮 (observe→think→act 迭代), 比 single_shot 单轮规划更能完成
  # 复杂任务. 单次 invoke 可用 extra_params.execution_strategy / max_iterations 覆盖.
  execution_strategy: "react"
  # 自我验证闭环 (方向3): 默认开 — 每个 agent 任务执行后做终态确认 (TaskVerifier
  # LLMJudge 判"是否真完成了目标"), 未完成则带缺口反馈自纠正 (auto, 预算 1 次重跑).
  # 形成 执行→校验→重规划 闭环。代价: 每任务 +1 次校验 LLM 调用 + 失败时至多 1 次重跑。
  # 无 LLM 通道时 verify 自动放行 (fail-open), 不阻断。想关: enable_self_verify=false 或 verify_mode=off。
  enable_self_verify: true
  verify_mode: "auto"
  max_correction: 1

document_store:
  dir: "documents"

state_store:
  dir: "state_store"

security:
  auth_enabled: true
  auth_type: "apikey"
  api_keys:
    - "${API_KEY_1}"
  jwt_secret: "${JWT_SECRET}"
  sensitive_config_secret: "${SENSITIVE_CONFIG_SECRET}"
  # 内部白名单 (前缀匹配): 这些 IP 即使没认证也允许 body tenant_id 透传。
  # 默认包含 localhost / 127.0.0.1, 方便本地 Web UI 直接选 tenant.
  # 生产部署面向公网时建议清空或调整为内网网段。
  internal_whitelist:
    - "127.0.0.1"
    - "localhost"
    - "::1"

remote_config:
  enabled: false
  url: "http://nacos-server:8848/nacos/v1/cs/configs"
  data_id: "rag-agent-config"
  group: "DEFAULT_GROUP"
  config_type: "yaml"
