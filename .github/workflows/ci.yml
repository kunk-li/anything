name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # smoke test 用占位 LLM,避免 CI 真打外网
      ANYTHING_DEV_MODE: "1"
      PYTHONPATH: "basic_support:data_layer:business:interface:application:run:."

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-${{ runner.os }}-${{ matrix.python-version }}-all-MiniLM-L6-v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试 / 运行时额外依赖(主 requirements 中故意不 pin,以最大兼容性)
          pip install pydantic faiss-cpu sentence-transformers
          # 文档解析可选依赖(document_parser_module 已用 try/except 包裹这些
          # import,即使不装也能跑 ABC 守护;但装上让 smoke test 有完整解析能力)
          pip install xmltodict PyPDF2 python-docx pandas python-pptx

      # =====================================================================
      # 阻塞性步骤 (失败则 CI 红): 单测 + ABC 守护
      # 这些不依赖外网 / LLM, 应该稳定通过
      # =====================================================================

      - name: Run unit tests per module (9 modules / 122 tests)
        run: |
          set -e
          modules=(
            "basic_support/schema_module"
            "basic_support/deps_module"
            "basic_support/config_module"
            "data_layer/chunker_module"
            "data_layer/vector_db_module"
            "data_layer/document_store_module"
            "business/rag_module"
            "business/agent_module"
            "interface/request_response_module"
          )
          failed=()
          for m in "${modules[@]}"; do
            echo "=== $m ==="
            if ! python -m unittest discover -s "$m/tests" -v; then
              failed+=("$m")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "FAILED modules: ${failed[*]}"
            exit 1
          fi

      - name: ABC alignment check (10 (Base, Impl) pairs)
        run: |
          python scripts/check_abc_alignment.py --ci

      # =====================================================================
      # 阻塞步骤 (失败 -> CI 红): smoke test 端到端
      # Run 26489096309 已证明在 ubuntu-latest 上 sentence-transformers
      # 模型下载 + RAG/Agent/Hybrid 3 个 case 都能稳定跑通 (HF cache 命中后
      # 模型不需重新下载). 现去掉 continue-on-error 提升 CI 严格度.
      # =====================================================================

      - name: Run smoke test (end-to-end)
        timeout-minutes: 8
        run: |
          cd run
          PYTHONPATH="../basic_support:../data_layer:../business:../interface:../application:.:.." \
            python -u run_smoke_test.py
