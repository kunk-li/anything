name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # smoke test 用占位 LLM,避免 CI 真打外网
      ANYTHING_DEV_MODE: "1"
      PYTHONPATH: "basic_support:data_layer:business:interface:application:run:."

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models (避免 smoke test 每次下载 sentence-transformers)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-${{ runner.os }}-${{ matrix.python-version }}-all-MiniLM-L6-v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试 / 运行时额外依赖(主 requirements 中故意不 pin,以最大兼容性)
          pip install pydantic faiss-cpu sentence-transformers

      - name: Run unit tests per module
        run: |
          set -e
          modules=(
            "basic_support/schema_module"
            "basic_support/deps_module"
            "data_layer/chunker_module"
            "data_layer/vector_db_module"
            "data_layer/document_store_module"
            "business/rag_module"
            "business/agent_module"
            "interface/request_response_module"
          )
          for m in "${modules[@]}"; do
            echo "=== $m ==="
            python -m unittest discover -s "$m/tests" -v
          done

      - name: Run smoke test (end-to-end)
        run: |
          cd run
          PYTHONPATH="../basic_support:../data_layer:../business:../interface:../application:.:.." \
            python run_smoke_test.py
