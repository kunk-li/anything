name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # smoke test 用占位 LLM,避免 CI 真打外网
      ANYTHING_DEV_MODE: "1"
      PYTHONPATH: "basic_support:data_layer:business:interface:application:run:."

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-${{ runner.os }}-${{ matrix.python-version }}-all-MiniLM-L6-v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试 / 运行时额外依赖(主 requirements 中故意不 pin,以最大兼容性)
          pip install pytest pydantic faiss-cpu sentence-transformers
          # 文档解析可选依赖(document_parser_module / 其测试用 importorskip 包裹这些,
          # 不装则相关测试 skip;装上让 smoke test + document_parser 测试完整跑)
          pip install xmltodict PyPDF2 python-docx pandas python-pptx reportlab

      # =====================================================================
      # 阻塞性步骤 (失败则 CI 红): 单测 + ABC 守护
      # 这些不依赖外网 / LLM, 应该稳定通过
      # =====================================================================

      # 全量 pytest (优化①修好 collection 后可一键跑): 覆盖所有模块 ~1161 tests, 取代
      # 原硬编码 9 模块 unittest discover (漏 api_service/orchestrator/long_term_memory 等)。
      # 可选重型依赖缺失的测试经 importorskip 优雅 skip, 不致 collection error。
      - name: Run full test suite (pytest)
        run: |
          set -e
          python -m pytest -q -p no:cacheprovider

      - name: ABC alignment check (19 (Base, Impl) pairs)
        run: |
          python scripts/check_abc_alignment.py --ci

      # =====================================================================
      # 阻塞步骤 (失败 -> CI 红): smoke test 端到端
      # Run 26489096309 已证明在 ubuntu-latest 上 sentence-transformers
      # 模型下载 + RAG/Agent/Hybrid 3 个 case 都能稳定跑通 (HF cache 命中后
      # 模型不需重新下载). 现去掉 continue-on-error 提升 CI 严格度.
      # =====================================================================

      - name: Run smoke test (end-to-end)
        timeout-minutes: 8
        run: |
          cd run
          PYTHONPATH="../basic_support:../data_layer:../business:../interface:../application:.:.." \
            python -u run_smoke_test.py
