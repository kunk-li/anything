name: Nightly Business Quality Eval

# 每日凌晨 3 点 UTC(北京时间 11:00) 自动跑业务质量评测.
# 也可在 Actions UI 手工 workflow_dispatch 触发(用真实 LLM 一次性验证).
#
# 跟主 CI(.github/workflows/ci.yml) 的关键区别:
#   - 主 CI: 单测 + 契约守护 + smoke (DummyLLM 兜底), 每次 push 都跑
#   - 本 workflow: 真实 LLM 端到端业务质量评测, 每日 1 次
#
# secrets 必需(在 Repo Settings -> Secrets and variables -> Actions 配):
#   - OPENAI_API_KEY        (或 DASHSCOPE_API_KEY, 至少其中之一)
#   - DASHSCOPE_API_KEY     (qwen 系列 LLM, 主链路 default_chat_model)
#   - JWT_SECRET            (启动期校验需要, 任意非空值即可)
# 详见 docs/secrets-management.md

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      rag_recall_threshold:
        description: RAG recall_keyword 阈值
        type: string
        default: "0.6"
      agent_success_threshold:
        description: Agent 通过率阈值
        type: string
        default: "0.75"

jobs:
  nightly-eval:
    name: Nightly business eval (real LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 真实 LLM 评测 — 不开 dev_mode, secrets 缺失会 fail-fast
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # 其他生产环境通常也需要的,有就用,没有给个占位让启动不挂
      API_KEY_1: ${{ secrets.API_KEY_1 || 'nightly-placeholder' }}
      VECTOR_DB_API_KEY: ${{ secrets.VECTOR_DB_API_KEY || 'nightly-placeholder' }}
      SENSITIVE_CONFIG_SECRET: ${{ secrets.SENSITIVE_CONFIG_SECRET || 'nightly-placeholder' }}
      PYTHONPATH: "basic_support:data_layer:business:interface:application:run:."

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-${{ runner.os }}-3.12-all-MiniLM-L6-v2-ms-marco

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pydantic faiss-cpu sentence-transformers
          pip install xmltodict PyPDF2 python-docx pandas python-pptx

      # =====================================================================
      # 检查 secrets 是否配置 (避免误以为"通过"是因为 DummyLLM 兜底)
      # =====================================================================
      - name: Verify secrets configured
        run: |
          missing=()
          [ -z "${OPENAI_API_KEY}${DASHSCOPE_API_KEY}" ] && missing+=("OPENAI_API_KEY or DASHSCOPE_API_KEY")
          [ -z "$JWT_SECRET" ] && missing+=("JWT_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required secrets not configured: ${missing[*]}"
            echo "::error::See docs/secrets-management.md for setup instructions"
            exit 1
          fi
          echo "✓ Required secrets configured"

      # =====================================================================
      # 索引中文 + 英文样本文档到 vector_store
      # =====================================================================
      - name: Index documents (Chinese + English)
        run: |
          cd run
          PYTHONPATH="../basic_support:../data_layer:../business:../interface:../application:.:.." \
              python index_build.py --source-type folder --source-path ../doc
          PYTHONPATH="../basic_support:../data_layer:../business:../interface:../application:.:.." \
              python index_build.py --source-type folder --source-path ../evaluation/sample_docs/en
          cd ..

      # =====================================================================
      # 跑业务质量评测 + 阈值守护
      # =====================================================================
      - name: Run business quality eval
        id: eval
        run: |
          set +e
          RAG_THRESHOLD="${{ inputs.rag_recall_threshold || '0.6' }}"
          AGENT_THRESHOLD="${{ inputs.agent_success_threshold || '0.75' }}"
          python evaluation/run_eval.py --ci \
              --rag-recall-threshold "$RAG_THRESHOLD" \
              --rag-file-hit-threshold 0.8 \
              --agent-success-threshold "$AGENT_THRESHOLD" \
              --verbose | tee eval_report.txt
          eval_exit=${PIPESTATUS[0]}
          echo "eval_exit=$eval_exit" >> $GITHUB_OUTPUT
          exit $eval_exit

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report
          path: eval_report.txt
          retention-days: 30

      # =====================================================================
      # 失败时自动开 GitHub Issue (一天最多一个, 避免刷屏)
      # =====================================================================
      - name: Create GitHub Issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `[nightly-eval] Business quality regression ${today}`;

            // 查是否已有今天的 issue, 避免重复
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-eval,regression',
              state: 'open',
              per_page: 100,
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              console.log(`Issue already exists: #${dup.number}`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Nightly business quality eval failed on ${today}.`,
              ``,
              `**Run**: ${runUrl}`,
              ``,
              `**Possible causes**:`,
              `- LLM API key expired or rate-limited`,
              `- RAG retrieval quality regression (recent prompt/embedding changes)`,
              `- Agent tool selection drift`,
              `- Real LLM responses changed (model upgrade upstream)`,
              ``,
              `Action items:`,
              `1. Check the run logs and downloaded "nightly-eval-report" artifact`,
              `2. Run \`python evaluation/run_eval.py -v\` locally with same secrets`,
              `3. If thresholds need adjusting, edit workflow_dispatch defaults`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['nightly-eval', 'regression'],
            });
            console.log('Issue created');
